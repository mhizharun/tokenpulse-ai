name: Build TokenPulse AI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run official tests
        run: pnpm test

      - name: Verify plugin bundle
        run: test -s dist/plugin.mjs

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: tokenpulse-ai-plugin
          path: dist/plugin.mjs
          if-no-files-found: error
